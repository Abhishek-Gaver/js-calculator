<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="cover">
        <div class="calculator">
            <div class="container">
                <div class="ask-ques"><input type="text" placeholder="..." class="type" readonly></div>
                <div class=input>
                    <button class="numbers"><h2>7</h2></button>
                    <button class="numbers"><h2>8</h2></button>
                    <button class="numbers"><h2>9</h2></button>
                    <button class="numbers"><h2>4</h2></button>
                    <button class="numbers"><h2>5</h2></button>
                    <button class="numbers"><h2>6</h2></button>
                    <button class="numbers"><h2>1</h2></button>
                    <button class="numbers"><h2>2</h2></button>
                    <button class="numbers"><h2>3</h2></button>
                    <button class="operators multiply"><h2>×</h2></button>
                    <button class="numbers"><h2>0</h2></button>
                    <button class="operators divide"><h2>÷</h2></button>
                    <button class="operators subtraction"><h2>-</h2></button>
                    <button class="operators addition"><h2>+</h2></button>
                    <button class="operators backspace"><h2>⌫</h2></button>
                    <button class="operators equal"><h2>=</h2></button>
                </div>
            </div>
    </section>
    <script src="script.js"></script>
</body>

</html>
